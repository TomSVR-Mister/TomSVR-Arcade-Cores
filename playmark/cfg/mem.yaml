params:
  - { name: OKI_OFFSET, value: "`OKI_START>>1" }

clocks:
  clk:
    - freq: 3000000
      outputs:
        - cen_3
    - freq: 1000000
      outputs:
        - cen_1

audio:
  rsum: 10k
  channels:
    - { name: pcm, module: jt6295, rsum: 10k, fir: fir_192k_4k.csv }

sdram:
  banks:
    - buses:
      - { name: main, addr_width: 22, data_width: 16, cache_size: 1kB }
      - { name: oki,  addr_width: 19, data_width: 8, offset: OKI_OFFSET }
    - buses:
      - { name: obj,  addr_width: 21, data_width: 32 }
    - buses:
      - { name: fg,   addr_width: 21, data_width: 32 }
      - { name: tx,   addr_width: 21, data_width: 32 }
      - { name: bg,   addr_width: 21, data_width: 32 }
    - buses:
      - { name: bmp,  addr_width: 19, data_width: 16, rw: true, din: cpu_dout }

bram:
  - name: wram
    size: 64kB
    data_width: 16
    rw: true
    din: cpu_dout
  - name: pal
    size: 2kB
    data_width: 16
    rw: true
    din: cpu_dout
    dual_port: { name: video, addr: pal_video_addr, dout: pal_video_dout, rw: false }
  - name: oram
    size: 4kB
    data_width: 16
    rw: true
    din: cpu_dout
  - name: fgram
    size: 8kB
    data_width: 16
    rw: true
    din: cpu_dout
    dual_port: { name: video, addr: fgram_video_addr, dout: fgram_video_dout, rw: false }
  - name: bgram
    size: 2kB
    data_width: 16
    rw: true
    din: cpu_dout
    dual_port: { name: video, addr: bgram_video_addr, dout: bgram_video_dout, rw: false }
  - name: txram
    size: 8kB
    data_width: 16
    rw: true
    din: cpu_dout
    dual_port: { name: video, addr: txram_video_addr, dout: txram_video_dout, rw: false }
