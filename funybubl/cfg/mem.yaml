params:
  - { name: SND_OFFSET, value: "`SND_START>>1" }
  - { name: OKI_OFFSET, value: "`OKI_START>>1" }

clocks:
  clk:
    - freq: 6000000
      outputs:
        - cen_6
    - freq: 4000000
      outputs:
        - cen_4
        - cen_2
        - cen_1

audio:
  rsum: 10k
  channels:
    - { name: pcm, module: jt6295, rsum: 10k, fir: fir_192k_4k.csv }

sdram:
  banks:
    - buses:
      - { name: main, addr_width: 18, data_width: 8, cache_size: 1kB }
      - { name: snd,  addr_width: 15, data_width: 8, offset: SND_OFFSET }
      - { name: oki,  addr_width: 19, data_width: 8, offset: OKI_OFFSET }
    - buses:
      - { name: spr,  addr_width: 21, data_width: 32 }
    - buses:
      - { name: tile, addr_width: 21, data_width: 32 }

bram:
  - name: pal
    size: 4kB
    data_width: 8
    rw: true
    din: cpu_dout
    dual_port: { name: video, addr: pal_video_addr, dout: pal_video_dout, rw: false }
  - name: vram
    size: 4kB
    data_width: 8
    rw: true
    din: cpu_dout
    dual_port: { name: video, addr: vram_video_addr, dout: vram_video_dout, rw: false }
  - name: sram
    size: 4kB
    data_width: 8
    rw: true
    din: cpu_dout
