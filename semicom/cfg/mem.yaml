params:
  - { name: SND_OFFSET, value: "`SND_START>>1" }
  - { name: OKI_OFFSET, value: "`OKI_START>>1" }

clocks:
  clk:
    - freq: 4000000
      outputs:
        - cen_4
        - cen_2
        - cen_1

audio:
  rsum: 10k
  channels:
    - { name: fm,  module: jt51,   rsum: 15k }
    - { name: pcm, module: jt6295, rsum: 10k, fir: fir_192k_4k.csv }

sdram:
  banks:
    - buses:
      - { name: main, addr_width: 19, data_width: 16, cache_size: 1kB }
      - { name: snd,  addr_width: 16, data_width: 8, offset: SND_OFFSET }
      - { name: oki,  addr_width: 18, data_width: 8, offset: OKI_OFFSET }
    - buses:
      - { name: gfx,  addr_width: 21, data_width: 32 }

bram:
  - name: wram
    size: 64kB
    data_width: 16
    rw: true
    din: wram_din
  - name: pal
    size: 512
    data_width: 16
    rw: true
    din: cpu_dout
    dual_port: { name: video, addr: pal_video_addr, dout: pal_video_dout, rw: false }
  - name: oram
    size: 4kB
    data_width: 8
    rw: true
    din: oram_din
    dual_port: { name: ovid, addr: ovid_addr, dout: ovid_dout, rw: false }
