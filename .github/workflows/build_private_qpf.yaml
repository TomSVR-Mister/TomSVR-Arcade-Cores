name: Build a plain Quartus core from the private repo

# Dispatch only: pushing never builds.
# Dispatch only. Source comes from the PRIVATE repo (PRIVATE_SRC_TOKEN, read-only), only the <core>/ folder;
#   gh workflow run build_private_qpf.yaml -R TomSVR-Mister/TomSVR-Arcade-Cores --ref main -f core=<folder> -f qpf=<project> [-f ref=main] [-f seeds=1,2]
# Nothing about the core is published here: the build log stays in the runner (only pass/fail is printed), and the
# rbf + reports are pushed to the PRIVATE repo, branch builds-<core>-<private sha7>[-s<seed>], with PRIVATE_PUSH_TOKEN
# (fine-grained token, Contents read/write on TomSVR-Mister/SegaMega-Tech only). Without that secret nothing is kept.
on:
  workflow_dispatch:
    inputs:
      core:
        description: "core folder in the private repo (e.g. x1)"
        default: x1
        required: true
      qpf:
        description: "Quartus project name in that folder, without .qpf (e.g. MyCore)"
        default: ""
        required: true
      ref:
        description: "branch or commit of the private repo"
        default: main
        required: false
      seeds:
        description: "Comma-separated fitter seeds, one parallel build each (e.g. 1,2,3)"
        default: "1"
        required: false

permissions:
  contents: write

jobs:
  mister:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        seed: ${{ fromJSON(format('[{0}]', inputs.seeds)) }}
    steps:
      - name: Free disk space for the Quartus image
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@v4
        with:
          repository: TomSVR-Mister/SegaMega-Tech
          ref: ${{ inputs.ref || 'main' }}
          token: ${{ secrets.PRIVATE_SRC_TOKEN }}
          path: src
          sparse-checkout: |
            ${{ inputs.core }}
          persist-credentials: false

      - name: Keep only the core folder (never docs/)
        run: |
          echo "sha=$(git -C src rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"
          test ! -e src/docs

      - name: Compile for MiSTer (Quartus Lite in jotego/jtcore20)
        shell: bash
        run: |
          set -o pipefail
          cat > src/build.sh <<'EOS'
          #!/bin/bash
          set -e
          # the wrapper in quartus/bin sets the library paths; linux64/quartus_sh alone fails to start
          Q=$(dirname $(ls -d /opt/intelFPGA*/*/quartus/bin/quartus_sh 2>/dev/null | head -1))
          echo "quartus at $Q"
          export PATH=$Q:$PATH
          cd /src/${{ inputs.core }}
          P=${{ inputs.qpf }}
          sed -i 's/^set_global_assignment -name SEED .*/set_global_assignment -name SEED ${{ matrix.seed }}/' $P.qsf
          grep -n "name SEED" $P.qsf
          quartus_sh --flow compile $P
          printf 'project_open %s\ncreate_timing_netlist\nread_sdc\nupdate_timing_netlist\nreport_timing -setup -npaths 40 -detail summary -file worst_paths.txt\nproject_close\n' $P > wp.tcl
          quartus_sta -t wp.tcl || true
          EOS
          sed -i 's/^          //' src/build.sh
          chmod +x src/build.sh
          docker run --network host -v "$PWD/src":/src jotego/jtcore20 /src/build.sh > build.log 2>&1 && echo "build OK" || { echo "build FAILED"; exit 1; }

      - name: Push rbf + reports to the private repo
        if: always()
        shell: bash
        env:
          TOKEN: ${{ secrets.PRIVATE_PUSH_TOKEN }}
        run: |
          [ -n "$TOKEN" ] || { echo "no PRIVATE_PUSH_TOKEN: nothing kept"; exit 0; }
          d=src/${{ inputs.core }}
          mkdir out && cd out
          git init -q
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          rbf=$(find ../$d -name '*.rbf' | head -1); [ -n "$rbf" ] && cp "$rbf" .
          mkdir -p logs; cp ../build.log logs/ 2>/dev/null || true
          find ../$d -name '*.fit.summary' -o -name '*.sta.summary' -o -name 'worst_paths.txt' | while read f; do cp "$f" logs/; done
          git add -A && git commit -q -m "build ${sha} seed ${{ matrix.seed }}"
          url="https://x-access-token:${TOKEN}@github.com/TomSVR-Mister/SegaMega-Tech.git"
          git push -q -f "$url" HEAD:builds-${{ inputs.core }}-${sha}-s${{ matrix.seed }} > /dev/null 2>&1 && echo "kept" || echo "push failed"
