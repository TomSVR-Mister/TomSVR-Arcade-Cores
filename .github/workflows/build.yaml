name: Build core

on:
  workflow_dispatch:
    inputs:
      core:
        description: "core folder (comad or galpin)"
        default: comad
        required: true

permissions:
  contents: write

jobs:
  mister:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space for the Quartus image
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@v4
        with:
          path: mine

      - name: Get JTFRAME and CPU/sound modules (jotego/jtcores, fixed commit)
        run: |
          git init -q jtcores
          cd jtcores
          git remote add origin https://github.com/jotego/jtcores.git
          git fetch -q --depth 1 origin bfced64dad833daa3864e601e9c0e90614c56df8
          git checkout -q FETCH_HEAD
          git submodule update --init modules/fx68k modules/jt6295 modules/jtopl modules/jt5205 modules/jt12 modules/jteeprom modules/jt51
          git -C modules/jt12 submodule update --init
          cp -r ../mine/${{ inputs.core }} cores/${{ inputs.core }}

      - name: Compile for MiSTer (Quartus 20.1 Lite in jotego/jtcore20)
        shell: bash
        run: |
          set -o pipefail
          cat > jtcores/build-core.sh <<'EOS'
          #!/bin/bash
          set -e
          git config --global --add safe.directory "*"
          cd /jtcores
          export JTROOT=/jtcores JTFRAME=/jtcores/modules/jtframe JTUTIL=/jtutil
          mkdir -p $JTUTIL
          source $JTFRAME/bin/setprj.sh > /dev/null
          export PATH=$PATH:/usr/local/go/bin
          jtutil seed --max-trials 4 ${{ inputs.core }} -mister --nodbg --nolinter
          EOS
          sed -i 's/^          //' jtcores/build-core.sh
          chmod +x jtcores/build-core.sh
          # same invocation style as jotego's own workflow (image entrypoint runs the given script)
          docker run --network host -v "$PWD/jtcores":/jtcores jotego/jtcore20 /jtcores/build-core.sh 2>&1 | tee build.log

      - name: Report the end of the build log as annotations
        if: always()
        shell: bash
        run: |
          {
            tail -n 120 build.log 2>/dev/null
            for f in $(find jtcores/log jtcores/cores/${{ inputs.core }} -name '*.log' 2>/dev/null | head -5); do echo "== $f"; tail -n 60 "$f"; done
          } | sed 's/\x1b\[[0-9;]*m//g' > tail.txt || true
          split -l 25 tail.txt part_ || true
          for f in part_*; do
            msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' "$f")
            echo "::notice title=log $f::$msg"
          done

      - name: Upload the core
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jt${{ inputs.core }}-mister
          path: |
            jtcores/release
            jtcores/log
          if-no-files-found: warn
          retention-days: 30

      - name: Also keep the .rbf on the 'builds' branch
        if: success()
        shell: bash
        run: |
          rbf=$(find jtcores/release -name '*.rbf' | head -1)
          [ -n "$rbf" ] || exit 0
          mkdir pub && cd pub
          git init -q
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          cp "../$rbf" .
          git add -A && git commit -q -m "jt${{ inputs.core }} build ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:${{ inputs.core == 'comad' && 'builds' || format('builds-{0}', inputs.core) }}
