gaelco2:
  - get:
    - jtgaelco2_game.v
    - jtgaelco2_main.v
    - jtgaelco2_vmem.v
    - jtgaelco2_mcu.v
    - jt8051_regs.v       # jotego's, with the SFR bit-write fix
    # Gaelco 2 video and GAE1 sound from jlrh/gaelco-fpga (GPLv3)
    - aligator_video_top.v
    - aligator_video_timing.v
    - aligator_gae1_video.v
    - aligator_gae1_tilemap.v
    - aligator_gae1_sprite.v
    - aligator_gae1_palette.v
    - aligator_gae1_sound.v
    - timing.sdc
jt8051:
  - get:
    - jt8051.v
    - jt8051_ctrl.v
    - jt8051_alu.v
    - jt8051_periph.v
    - jt8051_serial.v
    - timing.sdc
    ucode:
      src: "8051.yaml"
      output: "jt8051"
jteeprom:
  - get:
    - jt9346.v
jtframe:
  - get:
      - jtframe_edge.v
  - from: cpu
    get:
      - jtframe_m68k.yaml
  - from: ram
    get:
      - jtframe_dual_ram16.v
      - jtframe_ram16.v
      - jtframe_dual_ram.v
      - jtframe_ram_rst.v
