params:
  - { name: SND_OFFSET, value: "`SND_START>>1" }
  - { name: OKI_OFFSET, value: "`OKI_START>>1" }

clocks:
  clk:
    - freq: 4M
      outputs:
        - cen4
    - freq: 1M
      outputs:
        - cen1

audio:
  rsum: 10k
  channels:
    - { name: pcm, module: jt6295, rsum: 10k, fir: fir_192k_4k.csv }

sdram:
  banks:
    - buses:
      - { name: main, addr_width: 17, data_width: 16, cache_size: 1kB }
      - { name: snd,  addr_width: 15, data_width: 8, offset: SND_OFFSET }
      - { name: oki,  addr_width: 18, data_width: 8, offset: OKI_OFFSET }
    - buses:
      - { name: gfx,  addr_width: 19, data_width: 32 }

bram:
  - name: wram
    size: 64kB
    data_width: 16
    rw: true
    din: cpu_dout
  - name: xram
    size: 2kB
    data_width: 16
    rw: true
    din: cpu_dout
  - name: vram
    size: 16kB
    data_width: 16
    rw: true
    din: cpu_dout
    dual_port: { name: video, addr: vram_video_addr, dout: vram_video_dout, rw: false }
  - name: pal
    addr_width: 9
    data_width: 16
    rw: true
    din: cpu_dout
    dual_port: { name: video, addr: pal_video_addr, dout: pal_video_dout, rw: false }
