clocks:
  clk:
    - freq: 1000000
      outputs:
        - cen_oki

audio:
  rsum: 10k
  channels:
    - { name: pcm, module: jt6295, rsum: 10k, fir: fir_192k_4k.csv }

sdram:
  banks:
    - buses:
      - { name: main, addr_width: 20, data_width: 16, cache_size: 1kB }
    - buses:
      - { name: oki,  addr_width: 20, data_width: 8 }
    - buses:
      - { name: scr0, addr_width: 21, data_width: 32 }
      - { name: scr1, addr_width: 21, data_width: 32 }
      - { name: obj,  addr_width: 21, data_width: 32 }
