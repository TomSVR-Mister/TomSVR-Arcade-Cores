params:
  - { name: PCM_OFFSET, value: "(`PCM_START-`JTFRAME_BA1_START)>>1" }
  - { name: LVC_OFFSET, value: "(`LVC_START-`JTFRAME_BA2_START)>>1" }
clocks:
  clk:
    - freq: 8M
      outputs:
        - cen_8
        - cen_fm
        - cen_fm2
    - freq: 48000
      outputs:
        - cen_pcm
audio:
  rsum: 10k
  channels:
    - { name: fm,   module: jt51, rsum: 15k }
    - { name: k539, data_width: 16, rsum: 10k, stereo: true }
sdram:
  banks:
    - buses:
      - name: main
        addr_width: 20
        data_width: 16
        cache_size: 4kB
    - buses:
      - name: snd
        addr_width: 17
        data_width: 8
      - name: pcm
        addr_width: 22
        data_width: 8
        offset: PCM_OFFSET
    - buses:
      - name: tile
        addr_width: 21
        data_width: 32
      - name: lvc
        addr_width: 19
        data_width: 32
        offset: LVC_OFFSET
    - buses:
      - name: obj
        addr_width: 22
        data_width: 32
bram:
  - name: ram
    addr_width: 16
    data_width: 16
    addr: main_addr[15:1]
    din: cpu_dout
    rw: true
