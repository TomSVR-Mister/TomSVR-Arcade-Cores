params:
  - { name: SND_OFFSET, value: "`SND_START>>1" }

clocks:
  clk:
    - freq: 3375000
      outputs:
        - cen_snd

audio:
  rsum: 10k
  channels:
    - { name: fm, module: jtopl2, rsum: 10k }

sdram:
  banks:
    - buses:
      - { name: main, addr_width: 18, data_width: 16, cache_size: 1kB }
      - { name: snd,  addr_width: 16, data_width: 8, offset: SND_OFFSET }
    - buses:
      - { name: bgt,  addr_width: 22, data_width: 32 }
      - { name: fgt,  addr_width: 22, data_width: 32 }
    - buses:
      - { name: mgt,  addr_width: 22, data_width: 32 }
    - buses:
      - { name: obj,  addr_width: 22, data_width: 32 }

bram:
  - name: wram
    size: 32kB
    data_width: 16
    rw: true
    din: cpu_dout
  - name: pal
    size: 2kB
    data_width: 16
    rw: true
    din: cpu_dout
    dual_port: { name: video, addr: pal_video_addr, dout: pal_video_dout, rw: false }
  - name: objram
    size: 4kB
    data_width: 16
    rw: true
    din: cpu_dout
    dual_port: { name: video, addr: objram_video_addr, dout: objram_video_dout, rw: false }
  - name: vmid
    size: 4kB
    data_width: 16
    rw: true
    din: cpu_dout
    dual_port: { name: video, addr: vmid_video_addr, dout: vmid_video_dout, rw: false }
  - name: vfg
    size: 4kB
    data_width: 16
    rw: true
    din: cpu_dout
    dual_port: { name: video, addr: vfg_video_addr, dout: vfg_video_dout, rw: false }
  - name: vbg
    size: 4kB
    data_width: 16
    rw: true
    din: cpu_dout
    dual_port: { name: video, addr: vbg_video_addr, dout: vbg_video_dout, rw: false }
