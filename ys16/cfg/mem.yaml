params:
  - { name: OKI_OFFSET, value: "`OKI_START>>1" }
  - { name: SND_OFFSET, value: "`SND_START>>1" }

clocks:
  clk:
    - freq: 4M
      outputs:
        - cen4
        - cen2
        - cen_oki

audio:
  rsum: 10k
  channels:
    - { name: pcm, module: jt6295, rsum: 10k, fir: fir_192k_4k.csv }
    - { name: fm,  module: jtopl2, rsum: 12k }

sdram:
  banks:
    - buses:
      - { name: main, addr_width: 19, data_width: 16, cache_size: 1kB }
      - { name: oki,  addr_width: 19, data_width: 8, offset: OKI_OFFSET }
      - { name: snd,  addr_width: 16, data_width: 8, offset: SND_OFFSET }
    - buses:
      - { name: obj,  addr_width: 20, data_width: 32 }
    - buses:
      - { name: scr0, addr_width: 22, data_width: 32 }
    - buses:
      - { name: scr1, addr_width: 22, data_width: 32 }

bram:
  - name: wram
    size: 64kB
    data_width: 16
    rw: true
    din: cpu_dout
  - name: pal
    size: 16kB
    data_width: 16
    rw: true
    din: cpu_dout
    dual_port: { name: video, addr: pal_video_addr, dout: pal_video_dout, rw: false }
  - name: vram0
    size: 16kB
    data_width: 16
    rw: true
    din: cpu_dout
    dual_port: { name: video, addr: vram0_video_addr, dout: vram0_video_dout, rw: false }
  - name: vram1
    size: 16kB
    data_width: 16
    rw: true
    din: cpu_dout
    dual_port: { name: video, addr: vram1_video_addr, dout: vram1_video_dout, rw: false }
  - name: objram
    size: 4kB
    data_width: 16
    rw: true
    din: cpu_dout
    dual_port: { name: video, addr: objram_video_addr, dout: objram_video_dout, rw: false }
